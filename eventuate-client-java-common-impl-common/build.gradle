
dependencies {
    api project(":eventuate-client-java")

    api "io.eventuate.common.json:eventuate-common-json-mapper:$eventuateCommonJsonVersion"
    api "io.eventuate.common.id:eventuate-common-id:$eventuateCommonIdVersion"


